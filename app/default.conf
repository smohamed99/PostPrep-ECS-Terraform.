
#settings for nginx: a short list of instructions telling the web server how to behave.
 ##çThink of it as nginx’s rulebook.


server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}