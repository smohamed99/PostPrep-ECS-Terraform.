name: Build and push

on:
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: post-prep
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: post-prep-gha-build

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -t "${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG" ./app

      - name: Scan image
        uses: anchore/scan-action@v6
        with:
          image: "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          fail-build: true
          severity-cutoff: high

      - name: Push image
        run: docker push "${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update image tag in SSM
        run: |
          aws ssm put-parameter \
            --name /post-prep/image_tag \
            --value "$IMAGE_TAG" \
            --type String \
            --overwrite